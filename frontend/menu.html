<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시스템 메뉴</title>
  <style>
    :root {
      --bg-modal: #121522;
      --border-color: rgba(139, 92, 246, 0.4);
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .menu-card {
      width: 320px;
      background: #181b2a;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 25px rgba(139, 92, 246, 0.3);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: popIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .menu-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }
    .menu-title span {
      color: var(--accent);
    }
    .menu-divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }
    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .menu-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .btn-resume {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
    }
    .btn-resume:hover {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      transform: translateY(-1px);
    }
    .btn-home {
      background: #252a3d;
      color: #e2e8f0;
      border: 1px solid #3b4261;
    }
    .btn-home:hover {
      background: #333a54;
      color: #fff;
      transform: translateY(-1px);
    }
    .menu-footer {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="menu-card">
    <div class="menu-title">
      <span>⚙️</span> 시스템 메뉴
    </div>
    <div class="menu-divider"></div>
    <div class="btn-group">
      <button class="menu-btn btn-resume" id="btnResume" onclick="resumeEditor()">
        ▶ 재개 (Resume)
      </button>
      <button class="menu-btn btn-home" id="btnHome" onclick="goHome()">
        🏠 메뉴 (허브로)
      </button>
    </div>
    <div class="menu-footer">
      ESC 키를 눌러 에디터로 돌아갈 수 있습니다.
    </div>
  </div>

  <script>
    function resumeEditor() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'CLOSE_ESC_MENU' }, '*');
        try { window.parent.focus(); } catch(e) {}
      } else {
        window.close();
      }
    }

    function goHome() {
      if (window.parent && window.parent !== window) {
        window.parent.location.href = 'index.html';
      } else {
        window.location.href = 'index.html';
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        resumeEditor();
      }
    });
  </script>
</body>
</html>
